<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>MCA Student Portal</h1>
    
    <!-- Section for user to add details -->
    <div class="form-section">
        <h2>Add a Student</h2>
        <div>
            <label for="student-name">Name:</label>
            <input type="text" id="student-name" placeholder="Enter name">
        </div>
        <div>
            <label for="register-number">Register Number:</label>
            <input type="text" id="register-number" placeholder="Enter register number">
        </div>
        <div>
            <label for="programme">Programme:</label>
            <input type="text" id="programme" placeholder="Enter programme">
        </div>
        <button id="add-student-btn">Add Student</button>
    </div>

    <!-- Section where added students will be displayed -->
    <div class="display-section">
        <h2>Student List</h2>
        <div id="student-list">
            <!-- Student data will be shown here -->
        </div>
    </div>

    <!-- Contact information -->
    <div class="display-section">
        <h2>Contact Information</h2>
        <div class="contact-card">
            <p class="contact-row"><span class="contact-icon">✉️</span> <strong>Email:</strong> info@studentinfo.app</p>
            <p class="contact-row"><span class="contact-icon">📞</span> <strong>Phone:</strong> +1 (555) 123-4567</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
